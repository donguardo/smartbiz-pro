<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Offline — MVP BizManager</title>
<link rel="icon" href="/favicon.png" />
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#000;color:#fff;font-family:system-ui,sans-serif;text-align:center;padding:24px}
  .card{max-width:380px;border:1px solid rgba(255,0,255,.5);background:rgba(255,0,255,.12);backdrop-filter:blur(12px);border-radius:20px;padding:28px}
  img{width:72px;height:72px}
  h1{font-size:22px;margin:12px 0 6px}
  p{opacity:.8;line-height:1.5;margin:6px 0}
  button{margin-top:18px;background:#FF00FF;color:#000;border:0;border-radius:12px;padding:12px 22px;font-weight:700;font-size:15px}
</style>
</head>
<body>
<div class="card">
  <img src="/icon-192.png" alt="" />
  <h1>You're offline · Offline ka</h1>
  <p>No internet connection right now. Pages you opened before still work — reconnect to sync sales and see live numbers.</p>
  <p>Walang internet ngayon. Gumagana pa rin ang mga page na nabuksan mo na — kumonekta ulit para ma-sync ang benta.</p>
  <button onclick="location.reload()">Try again · Subukan ulit</button>
</div>
<script>addEventListener("online",()=>location.reload())</script>
</body>
</html>
